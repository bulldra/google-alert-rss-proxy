[project]
name = "google-alert-rss-proxy"
version = "0.1.0"
description = ""
authors = [{ name = "bulldra", email = "bulldra@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedgen==1.0.0",
    "feedparser==6.0.11",
    "requests==2.32.3",
    "flask==3.1.0",
    "functions-framework==3.8.2",
    "google-cloud-logging==3.11.3",
    "python-levenshtein==0.26.1",
    "google-genai>=1.14.0",
    "pydantic>=2.10.0",
    "google-cloud-storage>=3.1.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "feedparser",
    "feedgen.*",
    "Levenshtein",
    "google.cloud",
    "google.cloud.storage",
    "google.cloud.*",
    "dateutil",
    "dateutil.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
